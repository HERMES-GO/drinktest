<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>인공지능이 나에게 추천하는 음료는?</title>
<link href="https://fonts.googleapis.com/css2?family=Jua:wght@400&family=Gowun+Dodum&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
:root{--ink:#eef2ff;--muted:#b8c0ff;--accent:#7cf5d2;--accent2:#8ea0ff;--line:rgba(255,255,255,.14);--pad:clamp(12px,3.8vw,22px);--btnH:clamp(52px,7.2vh,64px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:'Gowun Dodum','Noto Sans KR',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#0f1023;min-height:100%;overflow-x:hidden}
body.page-intro{background:#0f1023 url('imgs/bg_intro_halloween.png') top center/contain no-repeat scroll}
body.page-quiz{background:#0f1023 url('imgs/bg_quiz_dashes.svg') center/cover no-repeat fixed}
body.page-result{background:#0f1023 url('imgs/bg_result_festival.svg') center/cover no-repeat fixed}
body::after{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(1200px 600px at 50% -200px,rgba(124,245,210,.08),rgba(0,0,0,0)),linear-gradient(180deg,rgba(0,0,0,.26),rgba(0,0,0,.18) 40%,rgba(0,0,0,.26))}
body.page-quiz::after,body.page-result::after{background:radial-gradient(1200px 600px at 50% -200px,rgba(124,245,210,.06),rgba(0,0,0,0)),linear-gradient(180deg,rgba(0,0,0,.16),rgba(0,0,0,.10) 40%,rgba(0,0,0,.16))}
@media (max-width:768px){body.page-intro .wrap{padding-top:calc(52vh + var(--pad))}body.page-quiz,body.page-result{background-attachment:scroll}}
.brand-band{position:fixed;left:0;right:0;top:0;z-index:30;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;display:flex;align-items:center;justify-content:space-between;pointer-events:none}
.brand{pointer-events:auto;font-family:'Nanum Pen Script',cursive;letter-spacing:.2px;font-size:clamp(15px,4.2vw,19px);padding:6px 12px;border-radius:16px;background:rgba(255,255,255,.10);border:1px dashed rgba(255,255,255,.35);color:#0e1636;transform:rotate(-1.5deg);box-shadow:0 8px 20px rgba(0,0,0,.22),inset 0 0 0 2px rgba(255,255,255,.05);backdrop-filter:blur(8px)}
.brand.right{transform:rotate(1.5deg)}
.footer-tag{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;pointer-events:none}
.footer-chip{pointer-events:auto;font-family:'Nanum Pen Script',cursive;letter-spacing:.2px;font-size:clamp(15px,4.2vw,19px);padding:8px 16px;border-radius:16px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0b1030;font-weight:900;box-shadow:0 10px 22px rgba(124,245,210,.28);border:0;transform:rotate(.5deg)}
.wrap{max-width:780px;margin:0 auto;padding:calc(44px + var(--pad) + env(safe-area-inset-top)) var(--pad) calc(60px + var(--pad) + env(safe-area-inset-bottom))}
.card{position:relative;background:rgba(23,25,54,.58);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:22px;padding:var(--pad);box-shadow:0 12px 28px rgba(0,0,0,.30)}
.page-quiz .card{background:rgba(23,25,54,.40);border-color:rgba(255,255,255,.10)}
.page-result .card{background:rgba(23,25,54,.52);border-color:rgba(255,255,255,.16)}
.card::before{content:'';position:absolute;inset:0;border-radius:22px;pointer-events:none;background:radial-gradient(12px 12px at 14% 18%,rgba(124,245,210,.18) 0 40%,transparent 41%),radial-gradient(10px 10px at 86% 78%,rgba(142,160,255,.16) 0 40%,transparent 41%);mix-blend-mode:screen;opacity:.65}
.h-title{font-family:'Jua',sans-serif;text-align:center;line-height:1.15;font-size:clamp(26px,6.2vw,40px);letter-spacing:.2px;margin:.1rem 0 .75rem}
.h-sub{color:#cfd5ff;font-size:clamp(13px,3.8vw,16px);text-align:center;margin:-4px 0 12px}
.hero{display:grid;gap:14px;justify-items:center;padding:10px 6px 6px}
.hero-badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.badge{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#dfe3ff;border-radius:999px;padding:7px 10px;font-weight:700;font-size:clamp(12px,3.6vw,14px)}
.btn{border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:12px 16px;min-height:var(--btnH);font-weight:800;font-size:clamp(16px,4.6vw,20px);background:#1a1f3d;color:var(--ink);cursor:pointer;transition:transform .06s,border-color .2s,background .2s;width:100%;touch-action:manipulation}
.btn:active{transform:scale(.985)}.btn:hover{border-color:var(--accent);background:#202654}.btn[disabled]{opacity:.6;cursor:default}
.btn-cta{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0b1030;border:0;box-shadow:0 8px 20px rgba(124,245,210,.25)}
.progress{height:10px;background:rgba(255,255,255,.10);border-radius:999px;overflow:hidden;margin:8px 0 14px}
.bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.q{font-size:clamp(18px,5vw,26px);font-weight:800;margin:14px 0 18px;text-align:center;line-height:1.45;white-space:normal}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.row{display:flex;gap:10px;align-items:center;margin-top:10px;justify-content:space-between}
.small{font-size:clamp(12px,3.6vw,14px);color:var(--muted)}.hidden{display:none}
.result{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid rgba(124,245,210,.4);background:rgba(124,245,210,.12);border-radius:999px;color:var(--accent);font-weight:900;font-size:clamp(13px,3.6vw,15px)}
.title{font-family:'Jua',sans-serif;font-size:clamp(22px,6vw,34px);font-weight:900;margin:.35rem 0 .6rem;text-align:center}
.ul{margin:.4rem 0 .2rem;padding-left:18px}.ul li{margin:.38rem 0;font-size:clamp(15px,4.4vw,18px);line-height:1.5}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.chip{padding:6px 9px;border:1px solid rgba(255,255,255,.2);border-radius:999px;color:#d9ddff;font-size:clamp(12px,3.6vw,14px)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;justify-content:center}
.imgbox{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:18px;padding:8px;display:flex;align-items:center;justify-content:center}
.ar{width:100%;max-width:560px;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:#0f1023}
.ar img{width:100%;height:100%;object-fit:contain;image-rendering:auto}
@keyframes floaty{0%{transform:translateY(0)}50%{transform:translateY(-3px)}100%{transform:translateY(0)}}
.floaty{animation:floaty 2.4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.btn,.bar,.floaty{transition:none;animation:none}}
</style>
</head>
<body class="page-intro">
<div class="brand-band"><div class="brand left">대원고</div><div class="brand right">메에페</div></div>
<div class="footer-tag"><div class="footer-chip">쿠킹클래스</div></div>
<div class="wrap">
  <div class="card" id="intro">
    <h1 class="h-title">인공지능이 나에게 추천하는<br/>음료는?</h1>
    <p class="h-sub">4개의 질문으로 오늘의 무드에 딱 맞는<br/>음료를 추천해드려요! 🍹</p>
    <section class="hero">
      <div class="hero-badges"><span class="badge">메에페</span><span class="badge">쿠킹클래스</span><span class="badge">인공지능</span></div>
      <button id="start" class="btn btn-cta floaty">시작하기</button>
    </section>
  </div>
  <div class="card hidden" id="quizCard">
    <h2 class="h-title">인공지능이 나에게 추천하는<br/>음료는?</h2>
    <div class="progress" role="progressbar" aria-label="진행률"><div id="bar" class="bar"></div></div>
    <div id="quiz" aria-live="polite">
      <div class="q" id="qText"></div>
      <div class="grid">
        <button id="btnA" class="btn"></button>
        <button id="btnB" class="btn"></button>
      </div>
      <div class="row"><button id="restartTop" class="btn">처음으로</button><span class="small">진행률 <span id="pct">0%</span></span></div>
    </div>
  </div>
  <div class="card hidden" id="resultCard">
    <div class="result">
      <div>
        <span class="pill">오늘의 타입</span>
        <div id="title" class="title"></div>
        <ul id="desc" class="ul"></ul>
        <div class="chips" aria-hidden="true"><span class="chip">리더 / 서포터</span><span class="chip">감성 / 실용</span><span class="chip">즉흥 / 계획</span><span class="chip">활력 / 따뜻함</span></div>
        <div class="actions"><button id="restart" class="btn">다시 하기</button></div>
      </div>
      <div class="imgbox"><figure class="ar"><img id="drinkImg" alt="오늘의 음료 결과 카드" decoding="async" loading="eager" /></figure></div>
    </div>
  </div>
</div>
<script>
const questions=[
 {text:'Q1. 오늘의 나의 컨디션은? 🌞😌<br/>',A:'에너지가 넘쳐! 뭔가 하고 싶어! ⚡',B:'차분히 쉬고 싶어. 🛋️'},
 {text:'Q2. 축제나 수업 시간에 나는<br/>주로 어디에 있을까? 🎉📚',A:'사람들 많은 곳에서 신나게! 🕺',B:'조용한 공간에서 혼자만의 시간. 🤫'},
 {text:'Q3. 간식 고를 때, 나는 어떤 맛에<br/>더 손이 가? 🍭🍋',A:'달달한 게 최고! 🍫',B:'새콤상큼한 게 좋아! 🍊'},
 {text:'Q4. 처음 보는 부스나 활동이 있으면<br/>어떻게 해? 🚀🏡',A:'모험가! 새로운 건 다 해봐야지! 🧭',B:'익숙하고 안정적인 게 좋아! 🧸'}
];
const R=(title,drink,img,recipeLine)=>({title,drink,img,lines:[`오늘의 당신은 ${title}`,`👉 추천 음료: ${drink}`,`🥤 레시피: ${recipeLine}`]});
const IMG='imgs/';
const results={
 'AAAA':R('활발하고 모험적인 타입!','청포도에이드',IMG+'01_grape_ade.png','탄산수 150ml + 청포도시럽 20ml + 얼음'),
 'AABA':R('파티의 중심! 새로운 경험을 즐겨보자구~','블루레몬에이드',IMG+'02_blue_lemon.png','사이다 150ml + 블루레몬시럽 20ml + 얼음'),
 'ABAA':R('조용하지만 도전 정신도 있는 나…','딸기우유',IMG+'03_strawberry_milk.png','우유 180ml + 딸기시럽 30ml + 얼음'),
 'ABBA':R('혼자서도 담대하게 탐험하는 나!','자몽에이드',IMG+'04_grapefruit_ade.png','사이다 150ml + 자몽시럽 20ml + 얼음'),
 'BAAA':R('차분하게 리드하는 낭만 리더!','아이스티',IMG+'05_black_tea.png','아이스티 30ml + 물 180ml + 얼음'),
 'BABA':R('신선한 재미를 찾아 떠나는 자유인!','블루그린 스파클',IMG+'06_grape_blue_mix.png','탄산수 150ml + 청포도시럽 10ml + 블루레몬시럽 10ml + 얼음'),
 'BBAA':R('상상력이 풍부한 예술가 기질!','딸기라떼',IMG+'07_strawberry_latte.png','우유 150ml + 딸기시럽 30ml + 얼음'),
 'BBBA':R('깊이 생각하는 사색가!','아샷추',IMG+'08_teashot.png','아이스티 30ml + 물 180ml + 에스프레소 30ml + 얼음'),
 'AAAB':R('언제나 유쾌한 분위기 메이커!','럭키 드링크',IMG+'09_random_ade.png','사이다 150ml + 시럽 20ml (랜덤 1종) + 얼음'),
 'AABB':R('활기차고 도전적인 스포츠형!','썬샤인 에이드',IMG+'10_blue_grapefruit_mix.png','사이다 150ml + 블루레몬시럽 10ml + 자몽시럽 10ml + 얼음'),
 'ABAB':R('주변을 따뜻하게 만드는 배려가 돋보여요.','초코밀크티',IMG+'11_choco_milktea.png','밀크티 30ml + 우유 200ml + 초코시럽 15ml + 얼음'),
 'ABBB':R('깊이 생각하는 사색가!','아이스초코',IMG+'12_iced_choco.png','우유 180ml + 초코시럽 40ml + 얼음'),
 'BAAB':R('든든하고 믿음직한 스타일!','밀크티',IMG+'13_milk_tea.png','밀크티 30ml + 우유 200ml + 얼음'),
 'BABB':R('현실적이고 효율적인 해결사!','자몽 아이스티',IMG+'14_grapefruit_tea.png','아이스티 20ml + 자몽시럽 10ml + 물 180ml + 얼음'),
 'BBAB':R('감성적이고 따뜻한 감수성의 소유자!','카페모카',IMG+'15_cafe_mocha.png','우유 150ml + 초코시럽 30ml + 에스프레소 30ml + 얼음'),
 'BBBB':R('조용히 논리와 지성을 추구하는 나!','청포도 아이스티',IMG+'16_grape_tea.png','아이스티 30ml + 청포도시럽 15ml + 물 180ml + 얼음')
};
let idx=0,picks=[],locked=false;
const body=document.body,intro=document.getElementById('intro'),quizCard=document.getElementById('quizCard'),resultCard=document.getElementById('resultCard');
const startBtn=document.getElementById('start'),qText=document.getElementById('qText'),btnA=document.getElementById('btnA'),btnB=document.getElementById('btnB');
const pct=document.getElementById('pct'),bar=document.getElementById('bar'),restartTop=document.getElementById('restartTop'),restart=document.getElementById('restart');
const title=document.getElementById('title'),desc=document.getElementById('desc'),drinkImg=document.getElementById('drinkImg');
function setPage(p){body.classList.remove('page-intro','page-quiz','page-result');body.classList.add('page-'+p)}
function showIntro(){setPage('intro');intro.classList.remove('hidden');quizCard.classList.add('hidden');resultCard.classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}
function setButtonsDisabled(d){btnA.disabled=d;btnB.disabled=d}
function renderQ(){const q=questions[idx];qText.innerHTML=q.text;btnA.textContent='A. '+q.A;btnB.textContent='B. '+q.B;const progress=Math.round((idx/questions.length)*100);pct.textContent=progress+'%';bar.style.width=progress+'%';setButtonsDisabled(false);locked=false}
function showQuiz(){setPage('quiz');intro.classList.add('hidden');resultCard.classList.add('hidden');quizCard.classList.remove('hidden');idx=0;picks=[];renderQ();window.scrollTo({top:0,behavior:'smooth'})}
function choose(letter){if(locked)return;locked=true;setButtonsDisabled(true);picks[idx]=letter;idx++;if(idx<questions.length){renderQ();setButtonsDisabled(true);setTimeout(()=>{setButtonsDisabled(false);locked=false},300)}else{showResult()}}
function showResult(){setPage('result');pct.textContent='100%';bar.style.width='100%';const key=picks.join('');const r=results[key];quizCard.classList.add('hidden');resultCard.classList.remove('hidden');title.textContent=r.title;desc.innerHTML='';r.lines.forEach(t=>{const li=document.createElement('li');li.textContent=t;desc.appendChild(li)});drinkImg.onerror=function(){this.src=IMG+'placeholder.png'};drinkImg.src=r.img;drinkImg.alt=r.drink+' 카드 이미지';window.scrollTo({top:0,behavior:'smooth'})}
function resetAll(){showIntro()}
startBtn.addEventListener('click',showQuiz);btnA.addEventListener('click',()=>choose('A'));btnB.addEventListener('click',()=>choose('B'));restartTop.addEventListener('click',resetAll);restart.addEventListener('click',resetAll);showIntro();
</script>
</body></html>
