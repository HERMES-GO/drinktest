<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 심리테스트 - 오늘의 나만의 음료 🍹</title>
<style>
  :root{--bg:#0f1023;--card:#171936;--ink:#eef2ff;--muted:#b8c0ff;--accent:#7cf5d2;--line:rgba(255,255,255,.12)}
  *{box-sizing:border-box}
  body{margin:0;background:#ede2d5;color:var(--ink);font-family:Pretendard,'Noto Sans KR',system-ui,sans-serif;background-position:top center;background-attachment:scroll;background-repeat:no-repeat}
  
  /* 가로 화면 배경 */
  @media (orientation: landscape) {
    body { background-image: url('imgs/bg_landscape.png'); background-size: 100vw auto; }
  }
  
  /* 세로 화면 배경 */
  @media (orientation: portrait) {
    body { background-image: url('imgs/bg_portrait.png'); background-size: 100vw auto; }
  }
  .wrap{max-width:980px;margin:40px auto;padding:20px}
  .card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:24px;padding:28px;box-shadow:0 12px 48px rgba(0,0,0,.35)}
  h1{margin:.2rem 0 .3rem;font-size:clamp(24px,3.6vw,36px)}
  p.lead{margin:0 0 14px;color:var(--muted)}
  .progress{height:10px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin:8px 0 18px}
  .bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#8ea0ff)}

  .q{font-size:clamp(18px,3.4vw,26px);font-weight:800;margin:10px 0 16px}
  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  @media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
  .btn{border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px 16px;font-weight:700;background:#1a1f3d;color:var(--ink);cursor:pointer;transition:transform .06s,border-color .2s,background .2s}
  .btn:hover{transform:translateY(-1px);border-color:var(--accent);background:#202654}
  .ghost{background:transparent}
  .small{font-size:13px;color:var(--muted)}
  .row{display:flex;gap:10px;align-items:center;margin-top:10px}
  .hidden{display:none}

  /* RESULT */
  .result{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
  @media(min-width:900px){.result{grid-template-columns:1.15fr .85fr}}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid rgba(124,245,210,.4);background:rgba(124,245,210,.12);border-radius:999px;color:var(--accent);font-weight:800}
  .title{font-size:clamp(22px,4vw,34px);font-weight:900;margin:.35rem 0 .6rem}
  .ul{margin:.4rem 0 .2rem;padding-left:18px}
  .ul li{margin:.25rem 0}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .chip{padding:6px 10px;border:1px solid rgba(255,255,255,.2);border-radius:999px;color:#d9ddff}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}

  /* 이미지 카드 */
  .imgbox{display:flex;align-items:center;justify-content:center}
  .ar{width:100%;max-width:580px;display:flex;align-items:center;justify-content:center}
  .ar img{max-width:100%;max-height:500px;object-fit:contain;border-radius:22px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>AI가 고른 오늘의 나만의 음료 🍹</h1>
    <p class="lead">4개의 A/B 질문 · 약 30초 · 결과 16종 (레시피 제공)</p>
    <div class="progress"><div id="bar" class="bar"></div></div>

    <!-- QUIZ -->
    <div id="quiz">
      <div class="q" id="qText"></div>
      <div class="grid">
        <button id="btnA" class="btn"></button>
        <button id="btnB" class="btn"></button>
      </div>
      <div class="row">
        <button id="restartTop" class="btn ghost">처음으로</button>
        <span class="small">진행률 <span id="pct">0%</span></span>
      </div>
    </div>

    <!-- RESULT -->
    <div id="result" class="hidden">
      <div class="result">
        <div>
          <span class="pill">오늘의 타입</span>
          <div id="title" class="title"></div>
          <ul id="desc" class="ul"></ul>
          <div class="chips">
            <span class="chip">리더 / 서포터</span>
            <span class="chip">감성 / 실용</span>
            <span class="chip">즉흥 / 계획</span>
            <span class="chip">활력 / 따뜻함</span>
          </div>
          <div class="actions">
            <button id="restart" class="btn">다시 하기</button>
            <button id="print" class="btn ghost">결과 인쇄</button>
          </div>
        </div>
        <div class="imgbox">
          <figure class="ar"><img id="drinkImg" alt="오늘의 음료 결과 카드" /></figure>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// 1) 질문
const questions = [
  { text:'Q1. 오늘의 나의 컨디션은?', A:'에너지가 넘쳐! 뭔가 하고 싶어!', B:'차분히 쉬고 싶어.' },
  { text:'Q2. 축제나 수업 시간에 나는 주로 어디에 있을까?', A:'사람들 많은 곳에서 신나게!', B:'조용한 공간에서 혼자만의 시간.' },
  { text:'Q3. 간식 고를 때, 나는 어떤 맛에 더 손이 가?', A:'달달한 게 최고 🍭', B:'새콤상큼한 게 좋아 🍋' },
  { text:'Q4. 처음 보는 부스나 활동이 있으면 어떻게 해?', A:'모험가! 새로운 건 다 해봐야지 🚀', B:'익숙하고 안정적인 게 좋아 🏡' }
];

// 2) 결과 매핑 + 이미지 (imgs/ 폴더)
const R = (title, drink, img, recipeLine) => ({
  title, drink, img,
  lines: [
    `오늘의 당신은 ${title}`,         // ① 결과 설명
    `👉 추천 음료: ${drink}`,          // ② 추천 음료
    `🥤 레시피: ${recipeLine}`         // ③ 레시피
  ]
});
const IMG='imgs/';
const results = {
  'AAAA': R('활발하고 모험적인 타입!','청포도에이드',IMG+'01_grape_ade.png','탄산수 150ml + 청포도시럽 20ml + 얼음'),
  'AAAB': R('파티의 중심! 새로운 경험을 즐겨보자구~','블루레몬에이드',IMG+'02_blue_lemon.png','탄산수 150ml + 블루레몬시럽 20ml + 얼음'),
  'AABA': R('조용하지만 도전 정신도 있는 타입!','딸기우유',IMG+'03_strawberry_milk.png','우유 180ml + 딸기시럽 20ml + 얼음'),
  'AABB': R('혼자서도 담대하게 탐험하는 타입!','자몽에이드',IMG+'04_grapefruit_ade.png','탄산수 150ml + 자몽시럽 20ml + 얼음'),
  'ABAA': R('차분하게 리드하는 낭만 리더!','홍차 아이스티',IMG+'05_black_tea.png','홍차 150ml + 얼음'),
  'ABAB': R('신선한 재미를 찾아 떠나는 자유인!','블루그린 스파클',IMG+'06_grape_blue_mix.png','탄산수 150ml + 청포도시럽 10ml + 블루레몬시럽 10ml + 얼음'),
  'ABBA': R('상상력이 풍부한 예술가 기질!','딸기라떼',IMG+'07_strawberry_latte.png','우유 150ml + 딸기시럽 25ml + 얼음'),
  'ABBB': R('깊이 생각하는 사색가!','홍차 스트레이트 아이스티',IMG+'08_black_tea_straight.png','홍차 180ml + 얼음'),
  'BAAA': R('언제나 유쾌한 분위기 메이커!','럭키 드링크',IMG+'09_random_ade.png','탄산수 150ml + 시럽 20ml (랜덤 1종) + 얼음'),
  'BAAB': R('활기차고 도전적인 스포츠형!','썬샤인 에이드',IMG+'10_blue_grapefruit_mix.png','탄산수 150ml + 블루레몬시럽 10ml + 자몽시럽 10ml + 얼음'),
  'BABA': R('주변을 따뜻하게 만드는 배려가 돋보여요.','초코밀크티',IMG+'11_choco_milktea.png','홍차 100ml + 우유 50ml + 초코시럽 15ml + 얼음'),
  'BABB': R('깊이 생각하는 진중한 스타일!','아이스초코',IMG+'12_iced_choco.png','우유 150ml + 초코시럽 25ml + 얼음'),
  'BBAA': R('든든하고 믿음직한 스타일!','밀크티',IMG+'13_milk_tea.png','홍차 100ml + 우유 50ml + 얼음'),
  'BBAB': R('현실적이고 효율적인 해결사!','자몽 아이스티',IMG+'14_grapefruit_tea.png','홍차 150ml + 자몽시럽 10ml + 얼음'),
  'BBBA': R('감성적이고 따뜻한 감수성의 소유자!','핑크 드림 라떼',IMG+'15_strawberry_light.png','우유 150ml + 딸기시럽 15ml + 얼음'),
  'BBBB': R('조용히 논리와 지성을 추구하는 타입!','청포도 아이스티',IMG+'16_grape_tea.png','홍차 150ml + 청포도시럽 15ml + 얼음')
};

// 3) 상태 & 렌더링
let idx=0, picks=[];
const qText=document.getElementById('qText');
const btnA=document.getElementById('btnA');
const btnB=document.getElementById('btnB');
const pct=document.getElementById('pct');
const bar=document.getElementById('bar');
const quiz=document.getElementById('quiz');
const result=document.getElementById('result');
const restartTop=document.getElementById('restartTop');
const restart=document.getElementById('restart');
const printBtn=document.getElementById('print');
const title=document.getElementById('title');
const desc=document.getElementById('desc');
const drinkImg=document.getElementById('drinkImg');

function renderQ(){
  const q=questions[idx];
  qText.textContent=q.text;
  btnA.textContent='A. '+q.A;
  btnB.textContent='B. '+q.B;
  const progress=Math.round((idx/questions.length)*100);
  (pct||{}).textContent = progress+'%';
  bar.style.width=progress+'%';
}
function choose(letter){
  picks[idx]=letter;
  idx++;
  if(idx<questions.length) renderQ();
  else showResult();
}
function showResult(){
  (pct||{}).textContent='100%'; bar.style.width='100%';
  const key=picks.join('');
  const r=results[key];
  quiz.classList.add('hidden'); result.classList.remove('hidden');
  title.textContent = r.title;                 // 큰 제목(설명형 문구)
  desc.innerHTML='';
  r.lines.forEach(t=>{const li=document.createElement('li'); li.textContent=t; desc.appendChild(li);});
  drinkImg.src=r.img; drinkImg.alt=r.drink+' 카드 이미지';
}
function resetAll(){
  idx=0; picks=[];
  result.classList.add('hidden'); quiz.classList.remove('hidden'); renderQ();
}
btnA.addEventListener('click',()=>choose('A'));
btnB.addEventListener('click',()=>choose('B'));
restartTop.addEventListener('click',resetAll);
restart.addEventListener('click',resetAll);
printBtn.addEventListener('click',()=>window.print());

// 초기 렌더
renderQ();
</script>
</body>
</html>
