<svg xmlns='http://www.w3.org/2000/svg' width='1440' height='2560' viewBox='0 0 1440 2560'>
  <defs>
    <linearGradient id='sky' x1='0' y1='0' x2='0' y2='1'>
      <stop offset='0%' stop-color='#b8f3ff'/>
      <stop offset='60%' stop-color='#a8f4e9'/>
      <stop offset='100%' stop-color='#c7fff1'/>
    </linearGradient>
    <symbol id="star" viewBox="0 0 20 20">
      <polygon points="10,1 12.6,7.2 19.3,7.6 14,11.8 15.9,18.3 10,14.8 4.1,18.3 6,11.8 0.7,7.6 7.4,7.2" fill="#4fc3f7"/>
    </symbol>
    <symbol id="spark" viewBox="0 0 20 20">
      <circle cx="10" cy="10" r="3" fill="#66e5c8"/>
      <circle cx="10" cy="3" r="2" fill="#66e5c8" opacity=".7"/>
      <circle cx="3" cy="10" r="2" fill="#66e5c8" opacity=".7"/>
      <circle cx="17" cy="10" r="2" fill="#66e5c8" opacity=".7"/>
      <circle cx="10" cy="17" r="2" fill="#66e5c8" opacity=".7"/>
    </symbol>
    <symbol id="balloon" viewBox="0 0 40 60">
      <ellipse cx="20" cy="22" rx="16" ry="20" fill="#66d1ff" opacity=".95"/>
      <ellipse cx="20" cy="22" rx="16" ry="20" fill="#ffffff" opacity=".12"/>
      <path d="M18 40 L22 40 L20 45 Z" fill="#4bb8f2"/>
      <path d="M20 45 C22 52, 14 54, 18 60" stroke="#4bb8f2" stroke-width="2" fill="none"/>
    </symbol>
    <pattern id="lightgrid" width="80" height="80" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="80" height="80" fill="none" stroke="rgba(0,0,0,0.04)" stroke-width="1"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.08)" />
    </radialGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#sky)"/>
  <rect width="100%" height="100%" fill="url(#lightgrid)" opacity=".5"/>
  <g opacity=".35">
    <use href="#balloon" x="80" y="120" />
    <use href="#balloon" x="1120" y="200" transform="scale(1.1)"/>
  </g>
  <g opacity=".55">
    <use href="#star" x="260" y="460"/>
    <use href="#star" x="1200" y="520" transform="scale(0.9)"/>
    <use href="#spark" x="420" y="180"/>
    <use href="#spark" x="980" y="140"/>
    <use href="#spark" x="220" y="760" transform="scale(1.2)"/>
  </g>
  <rect width="100%" height="100%" fill="url(#vig)"/>
</svg>